name: Publicar web de Lacteoca

on:
  push:
    branches:
      - web-lacteoca
  workflow_dispatch:
  # Todos los días a las 6:00 a.m. de Caracas: refresca los puntos de venta desde GK y vuelve a publicar
  schedule:
    - cron: '0 10 * * *'

concurrency:
  group: web-lacteoca
  cancel-in-progress: true

jobs:
  publicar:
    runs-on: ubuntu-latest
    env:
      PROYECTO: geniuskeeper-36553
      GOOGLE_APPLICATION_CREDENTIALS: /tmp/firebase-sa.json
    steps:
      - uses: actions/checkout@v4

      - name: Escribir credenciales
        env:
          SA_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: printf '%s' "$SA_JSON" > /tmp/firebase-sa.json

      - name: Instalar Firebase CLI
        run: npm install -g firebase-tools

      # Puntos de venta activos de retail desde GK; si falla, se usa la última lista guardada.
      - name: Leer puntos de venta de GK
        continue-on-error: true
        run: |
          npm install --no-save --no-audit --no-fund firebase-admin
          node tools/gk-puntos.mjs

      - name: Generar páginas (dónde comprar, recetas, sitemap)
        run: node tools/build-paginas.mjs

      # Busca o crea el sitio de Hosting para la web (los nombres son únicos en todo Firebase).
      - name: Preparar sitio de Hosting
        id: sitio
        run: |
          SITIO=""
          for s in lacteoca lacteoca-web lacteoca-ve lacteoca-com; do
            if firebase hosting:sites:get "$s" --project "$PROYECTO" --non-interactive >/dev/null 2>&1; then SITIO="$s"; break; fi
            if firebase hosting:sites:create "$s" --project "$PROYECTO" --non-interactive >/dev/null 2>&1; then SITIO="$s"; break; fi
          done
          if [ -z "$SITIO" ]; then echo "No se pudo crear ni encontrar un sitio de Hosting"; exit 1; fi
          echo "Sitio de Hosting: $SITIO  ->  https://$SITIO.web.app"
          echo "id=$SITIO" >> "$GITHUB_OUTPUT"
          echo "::notice title=Sitio publicado::https://$SITIO.web.app"
          jq --arg s "$SITIO" '.hosting.site = $s' firebase.json > /tmp/fb.json && mv /tmp/fb.json firebase.json

      - name: Publicar en Firebase Hosting
        run: firebase deploy --only hosting --project "$PROYECTO" --non-interactive

      # Registra lacteoca.com y www.lacteoca.com en el sitio e imprime los registros DNS que hay que poner.
      - name: Conectar dominio lacteoca.com
        if: github.event_name == 'workflow_dispatch'
        continue-on-error: true
        env:
          SITIO: ${{ steps.sitio.outputs.id }}
        run: |
          gcloud auth activate-service-account --key-file="$GOOGLE_APPLICATION_CREDENTIALS" --quiet
          TOKEN=$(gcloud auth print-access-token)
          API="https://firebasehosting.googleapis.com/v1beta1/projects/$PROYECTO/sites/$SITIO/customDomains"
          curl -s -X POST -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/json" \
            "$API?customDomainId=lacteoca.com" -d '{}' | jq -c '{name, error}' || true
          curl -s -X POST -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/json" \
            "$API?customDomainId=www.lacteoca.com" -d '{"redirectTarget":"lacteoca.com"}' | jq -c '{name, error}' || true
          sleep 20
          for d in lacteoca.com www.lacteoca.com; do
            R=$(curl -s -H "Authorization: Bearer $TOKEN" "$API/$d")
            echo "$R" | jq '{hostState, ownershipState, cert: .cert.state, requiredDnsUpdates, error}'
            ERR=$(echo "$R" | jq -r '.error.message // empty')
            if [ -n "$ERR" ]; then echo "::warning title=Dominio $d::$ERR"; continue; fi
            echo "::notice title=Estado $d::host=$(echo "$R" | jq -r '.hostState // "-"') propiedad=$(echo "$R" | jq -r '.ownershipState // "-"') cert=$(echo "$R" | jq -r '.cert.state // "-"')"
            echo "$R" | jq -r '.requiredDnsUpdates.desired[]?.records[]? | "\(.domainName) | \(.type) | \(.rdata) | \(.requiredAction)"' | while read -r L; do
              echo "::notice title=DNS requerido $d::$L"
            done
            echo "$R" | jq -r '.requiredDnsUpdates.discovered[]?.records[]? | "\(.domainName) | \(.type) | \(.rdata)"' | while read -r L; do
              echo "::notice title=DNS actual $d::$L"
            done
          done

      - name: Limpiar credenciales
        if: always()
        run: rm -f /tmp/firebase-sa.json
