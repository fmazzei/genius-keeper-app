<!doctype html>
<html lang="es" translate="no">
  <head>
    <meta charset="UTF-8" />
    <!--
      La app es 100% en español. Declararla como `lang="en"` hacía que Chrome
      la detectara como "inglés con texto español" y la auto-tradujera para
      usuarios con idioma destino inglés. La traducción reemplaza los nodos de
      texto (envueltos en <font>) y, al re-renderizar React (Home del vendedor:
      loading→stats→alertas), rompe la reconciliación con
      "Failed to execute 'insertBefore' on 'Node'". lang="es" + notranslate lo evita.
    -->
    <meta name="google" content="notranslate" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Genius Keeper" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="manifest" href="/manifest.json" />
    <!--
      "Instalar Genius Keeper": Chrome ofrece la instalación con el evento
      `beforeinstallprompt`, UNA vez y a veces antes de que el bundle cargue.
      Se guarda acá, en ES5 puro (WebViews viejos), para que el botón de la app
      (InstalarApp en App.tsx) lo use cuando monte. Todo en try/catch.
    -->
    <script>
      try {
        window.addEventListener('beforeinstallprompt', function (e) {
          e.preventDefault();
          window.__gkInstallPrompt = e;
          try { window.dispatchEvent(new Event('gk-install-ready')); } catch (x) {}
        });
        window.addEventListener('appinstalled', function () {
          window.__gkInstallPrompt = null;
          try { window.dispatchEvent(new Event('gk-installed')); } catch (x) {}
        });
      } catch (err) {}
    </script>
    <!--
      Vigilante de arranque (ES5, sin dependencias). Si el código de la app no
      llega a montar, el splash de abajo giraría para siempre. Pasa sobre todo
      tras un deploy: un navegador con la página VIEJA en caché pide archivos
      de código que ya no existen. Si un script de /assets/ falla, se recarga
      UNA vez (la recarga revalida la página); si a los 20 s la app sigue sin
      montar, el splash ofrece "Recargar" en vez de girar en silencio.
    -->
    <script>
      (function () {
        var KEY = 'gk_boot_reload';
        function get() { try { return sessionStorage.getItem(KEY); } catch (e) { return null; } }
        function set(v) { try { if (v) sessionStorage.setItem(KEY, v); else sessionStorage.removeItem(KEY); } catch (e) {} }
        function montada() { return !document.getElementById('gk-splash'); }
        function boton() {
          var sp = document.getElementById('gk-splash');
          if (!sp || document.getElementById('gk-splash-btn')) return;
          var p = document.createElement('p');
          p.style.cssText = 'color:#94a3b8;font-family:system-ui,sans-serif;font-size:13px;text-align:center;max-width:280px;margin:0;';
          p.appendChild(document.createTextNode('La app está tardando en abrir. Toca para intentar de nuevo.'));
          var b = document.createElement('button');
          b.id = 'gk-splash-btn';
          b.appendChild(document.createTextNode('Recargar'));
          b.style.cssText = 'background:#10b981;color:#fff;border:0;border-radius:12px;padding:12px 28px;font-weight:700;font-size:14px;font-family:system-ui,sans-serif;';
          b.onclick = function () { set(null); location.reload(); };
          sp.appendChild(p); sp.appendChild(b);
        }
        try {
          window.addEventListener('error', function (e) {
            var t = e && e.target;
            if (!t || t.tagName !== 'SCRIPT' || !/\/assets\//.test(t.src || '') || montada()) return;
            if (!get()) { set('1'); location.reload(); } else { boton(); }
          }, true);
        } catch (e) {}
        var n = 0;
        var timer = setInterval(function () {
          n++;
          if (montada()) { set(null); clearInterval(timer); return; }
          if (n >= 20) { clearInterval(timer); boton(); }
        }, 1000);
      })();
    </script>
    <meta property="og:title" content="Genius Keeper" />
    <meta property="og:image" content="https://geniuskeeper-36553.web.app/apple-touch-icon.png" />
    <meta property="og:image:width" content="180" />
    <meta property="og:image:height" content="180" />
    <title>Genius Keeper</title>
  </head>
  <body>
    <div id="root">
      <!--
        Splash inline: el bundle de la app puede tardar varios segundos en
        descargar/parsear en redes móviles lentas (caso típico: mercaderista
        en campo). Sin esto, el usuario ve una pantalla blanca total hasta
        que React monta — este markup se reemplaza apenas ReactDOM.render()
        corre, así que no requiere limpieza manual.
      -->
      <div id="gk-splash" style="position:fixed;top:0;right:0;bottom:0;left:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;background:#020617;">
        <div style="width:48px;height:48px;border-radius:9999px;border:4px solid #1e293b;border-top-color:#10b981;animation:gk-spin 0.8s linear infinite;"></div>
        <p style="color:#64748b;font-family:system-ui,-apple-system,sans-serif;font-size:13px;letter-spacing:0.05em;">Cargando Genius Keeper…</p>
      </div>
      <style>@keyframes gk-spin{to{transform:rotate(360deg)}}</style>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
